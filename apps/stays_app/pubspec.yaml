name: stays_app
description: Thin app shell. Composes the feature packages and owns nothing else.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  core: any
  design_system: any
  feature_auth: any
  feature_browse: any
  feature_favourites: any
  feature_host: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  fpdart: ^1.2.0
  go_router: ^18.0.2
  l10n: any
  listings: any

dev_dependencies:
  dio: ^5.11.1
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  yaml: ^3.1.4

flutter:
  uses-material-design: true
