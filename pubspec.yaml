name: stays_workspace
description: Melos 8 / pub workspace root for the stays app. Holds tooling only.
publish_to: none

environment:
  sdk: ^3.13.0

# The app shell (apps/stays_app) joins in step 1.5.
workspace:
  - packages/core
  - packages/design_system
  - packages/l10n
  - packages/listings
  - packages/feature_auth
  - packages/feature_browse
  - packages/feature_favourites
  - packages/feature_host

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.9.0
  riverpod_lint: ^3.1.9

melos:
  scripts:
    gen:
      description: Run build_runner in every package that depends on it.
      exec:
        command: dart run build_runner build
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    analyze:
      description: Static analysis (dart analyze, so analyzer plugins run) with fatal infos.
      exec:
        command: dart analyze --fatal-infos
        concurrency: 2

    format:
      description: Format all Dart code.
      run: dart format .

    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --output=none --set-exit-if-changed .

    test:
      description: Run tests with coverage in every package that has a test folder.
      exec:
        command: flutter test --coverage
        concurrency: 1
      packageFilters:
        dirExists: test
